<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Maquette 3 sur 3 de Sardinebagarre (« Cahier ») : Papier quadrillé, crayon et surligneurs : un jeu dessiné à la main dans un cahier d’écolier.">
<title>Maquette 3 · Cahier</title>
<!-- Maquette statique (étape 2.1 du plan). Toucher une carte cachée la retourne, pour voir les faces. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-variant-numeric:lining-nums tabular-nums;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  background:var(--fond-mac);color:var(--encre);font-family:var(--police-texte);overflow:hidden;
}
.app{
  height:100dvh;max-width:480px;margin:0 auto;position:relative;
  display:grid;grid-template-rows:auto 1fr auto auto auto;grid-template-areas:"hud" "table" "message" "actions" "nav";
  gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px);
  background:var(--fond);
}
.hud{grid-area:hud;display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch}
.hud .bloc{display:flex;flex-direction:column;justify-content:center;padding:6px 10px;min-width:0}
.hud small{font-size:11px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud strong{font-family:var(--police-chiffres);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.hud .niveau strong{font-size:26px}
.table{grid-area:table;container-type:size;display:grid;place-items:center;min-height:0}
.board{
  width:min(100cqw,100cqh);aspect-ratio:1;display:grid;
  grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:var(--gap,5px);
}
.card,.ind,.coin{min-width:0;min-height:0;position:relative}
.card{border:0;font:inherit;color:inherit;cursor:pointer;display:grid;place-items:center}
.chiffre{font-family:var(--police-chiffres);font-size:min(9cqw,9cqh);line-height:1;font-weight:800}
.m{position:absolute;font-style:normal;font-family:var(--police-chiffres);font-weight:800;font-size:min(2.6cqw,2.6cqh);line-height:1;
  width:1.45em;height:1.45em;display:grid;place-items:center;border-radius:50%;opacity:0;transition:opacity .15s}
.m.on{opacity:1}
.m-s{top:3px;left:3px}.m-1{top:3px;right:3px}.m-2{bottom:3px;left:3px}.m-3{bottom:3px;right:3px}
.medaillon{width:82%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.tete{width:100%;height:100%}
.ind{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ind b{font-family:var(--police-chiffres);font-size:min(5.4cqw,5.4cqh);line-height:1;font-variant-numeric:tabular-nums}
.ind span{display:flex;align-items:center;gap:2px;font-family:var(--police-chiffres);font-weight:800;font-size:min(3.8cqw,3.8cqh);line-height:1}
.mini{width:1.25em;height:1.25em}
.message{grid-area:message;text-align:center;min-height:1.4em;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{grid-area:actions;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{min-height:48px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;color:inherit}
.nav{grid-area:nav;display:flex;justify-content:center;gap:14px;font-size:12px;opacity:.75}
.nav a{color:inherit}
.boom{animation:boum .5s ease-out}
@keyframes boum{0%{transform:scale(.6) rotate(-8deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:none}}
.flip{animation:retourne .28s ease-out}
@keyframes retourne{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.boom,.flip{animation:none}}
/* Paysage bas (UI-15) : plateau à gauche, le reste à droite */
@media (orientation:landscape) and (max-height:540px){
  .app{max-width:none;grid-template-columns:1fr minmax(220px,300px);grid-template-rows:auto 1fr auto auto;
    grid-template-areas:"table hud" "table message" "table actions" "table nav";column-gap:20px}
  .hud{grid-template-columns:1fr 1fr}.hud .niveau{grid-column:1 / -1}
  .message{white-space:normal;align-self:center}
}

:root{
  --fond-mac:#e9e3d6;
  --fond:#fbf8f1;
  --encre:#2e2f4a;
  --police-texte:"Chalkboard SE","Marker Felt","Comic Sans MS",cursive;
  --police-chiffres:"Chalkboard SE","Marker Felt","Comic Sans MS",cursive;
  --chien-tete:#e2b07a;--chien-oreille:#9a6a44;--chien-museau:#fff4e2;
}
body{background:#e9e3d6}
.app{background:
  linear-gradient(90deg,transparent 22px,rgba(226,88,88,.45) 22px 24px,transparent 24px),
  linear-gradient(rgba(84,140,214,.18) 1px,transparent 1px) 0 0/16px 16px,
  linear-gradient(90deg,rgba(84,140,214,.18) 1px,transparent 1px) 0 0/16px 16px,#fbf8f1}
@media (min-width:600px){body{background:repeating-linear-gradient(-30deg,#e9e3d6 0 12px,#e3dccd 12px 24px)}.app{box-shadow:6px 8px 0 rgba(46,47,74,.15),0 0 0 1px #d9d0bd}}
.hud .bloc{background:#fff6a8;color:#2e2f4a;border-radius:3px;box-shadow:2px 3px 0 rgba(46,47,74,.15);transform:rotate(-1deg)}
.hud .bloc:nth-child(2){background:#c9f0dc;transform:rotate(.8deg)}
.hud .bloc:nth-child(3){background:#ffd6e0;transform:rotate(-.5deg)}
.hud strong{font-weight:700}
.board{--gap:7px}
.card{border-radius:10px 12px 9px 11px;border:2.2px solid #2e2f4a}
.card:nth-child(3n){transform:rotate(-1.2deg)}.card:nth-child(4n+1){transform:rotate(1deg)}
.cachee{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(46,47,74,.14) 6px 7.5px),#fff}
.cachee:active{background-color:#f0f0ff}
.face{background:#fff;color:#2e2f4a}
.chiffre{font-weight:700}
.sardine{background:#ffd6e0;border-color:#d1435b;border-width:3px;box-shadow:0 0 0 4px rgba(209,67,91,.2)}
.medaillon{background:#fff;border:2px dashed #d1435b}
.m{color:#d1435b;font-weight:700;width:auto;height:auto}
.ind{border-radius:12px 9px 11px 8px;border:2.2px solid #2e2f4a;color:#2e2f4a}
.ind b{font-weight:700}
.c0{background:#ffb3ba}.c1{background:#b5ead7}.c2{background:#ffe29a}.c3{background:#a8d8ff}.c4{background:#d7c1ff}
.coin{display:grid;place-items:center;font-size:min(7cqw,7cqh);color:#d1435b;transform:rotate(-12deg)}
.message{color:#d1435b}
.actions button{background:#fff;border:2.5px solid #2e2f4a;border-radius:14px 10px 13px 9px;box-shadow:3px 3px 0 #2e2f4a;font-family:var(--police-texte)}
.actions button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2e2f4a}
</style>
</head>

<script>
document.querySelectorAll('.card.cachee').forEach(function(b){
  b.addEventListener('click',function(){
    var v=Number(b.dataset.v),d=document.createElement('div');
    if(v===0){d.className='card face sardine boom';d.innerHTML='<span class="medaillon"><svg class="tete" viewBox="0 0 100 100"><use href="#chien"/></svg></span>';}
    else{d.className='card face flip';d.innerHTML='<span class="chiffre">'+v+'</span>';}
    b.replaceWith(d);
  });
});
</script>
