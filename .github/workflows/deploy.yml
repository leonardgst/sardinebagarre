name: Déploiement

# Publie le jeu sur GitHub Pages à chaque push sur main, seulement si toutes les vérifications passent.
# Prérequis : Settings › Pages › Build and deployment › Source = « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » pour republier à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    uses: ./.github/workflows/ci.yml

  construire:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
